<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>Physics Essence 90</title>
  <style>
    html,body{margin:0;min-height:100%;background:#07101f;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px;box-sizing:border-box}
    .loading strong{font-size:20px}.loading p{opacity:.7;font-size:13px}
  </style>
</head>
<body>
  <div class="loading"><div><strong>Physics Essence 90</strong><p>2027 共通テスト対応版を読み込み中…</p></div></div>
  <script>
    (async()=>{
      try{
        const names=['chunks/gz01.txt','chunks/gz02.txt','chunks/gz03.txt','chunks/gz04.txt'];
        const parts=await Promise.all(names.map(n=>fetch(n,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(n);return r.text()})));
        const b64=parts.join('');
        const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
        const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
        const html=await new Response(stream).text();
        document.open();document.write(html);document.close();
      }catch(e){
        document.body.innerHTML='<div class="loading"><div><strong>読み込みに失敗しました</strong><p>ページを再読み込みしてください。</p></div></div>';
      }
    })();
  </script>
</body>
</html>
